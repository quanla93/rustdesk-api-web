name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build admin frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-api-web-dist
          path: dist/
          if-no-files-found: error

  trigger-api-build:
    name: Trigger rustdesk-api build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Trigger rustdesk-api workflow
        env:
          GH_TOKEN: ${{ secrets.API_WORKFLOW_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing API_WORKFLOW_TOKEN secret. Add a GitHub token with Actions write access to quanla93/rustdesk-api."
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REF_NAME="${GITHUB_REF#refs/tags/}"
          else
            REF_NAME="master"
          fi

          gh workflow run build.yml \
            --repo quanla93/rustdesk-api \
            --ref master \
            -f WEBCLIENT_SOURCE_REPOSITORY=quanla93/rustdesk-api-web \
            -f WEBCLIENT_SOURCE_REF=$REF_NAME \
            -f EXPLICIT_RELEASE_TAG=$REF_NAME
            -f SKIP_DOCKER_HUB=true \
            -f SKIP_GHCR=false
